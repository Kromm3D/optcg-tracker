# Refresco diario de los datos que la app consume desde el repo.
#
# Por qué existe: `data/index.json` y `data/prices.json` se sirven por jsDelivr
# desde este repo, así que hasta ahora un set nuevo o un precio movido exigían
# que alguien se acordase de correr los scripts a mano. Este workflow lo hace
# solo.
#
# Dos jobs deliberadamente separados, y con distinta política de publicación:
#   - catalog: abre un PR, nunca empuja a `main` directamente. El catálogo se
#     scrapea del sitio oficial; un cambio de maquetación ahí se manifiesta
#     como cartas que desaparecen o campos vacíos, no como una excepción, así
#     que merece un diff visible antes de llegar a los usuarios.
#   - prices: empuja a `main` directamente si pasa el paso `verify`. Los
#     precios ya tienen su propio gate específico en Python (umbral de
#     entradas + heurística de emparejamiento auditada, ver
#     scripts/build_prices_bulk.py) y `lib/remotePrices.ts` los aplica en la
#     app sin pedir confirmación al usuario — un PR pendiente de aprobar a
#     diario era justo la fricción que se quería quitar. Que fallen los
#     precios no debe impedir que entre un set nuevo (por eso van en jobs
#     separados) ni bloquearse esperando una revisión manual.

name: Refresh card data

on:
  schedule:
    # Diario 08:00 UTC.
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      prices:
        description: 'Intentar también el refresco de precios'
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

jobs:
  catalog:
    name: Card catalog (official site)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install requests beautifulsoup4 pillow imagehash

      - name: Rebuild index
        # Metadatos primero. El nombre legible de cada set se deduce aquí de las
        # propias cartas (set_meta[code].name), así que un set nuevo llega con
        # nombre sin que nadie edite setMeta.ts.
        run: python scripts/build_card_database.py --index-only

      - name: Sync index into the app bundle
        # El bundler de Metro lee app/src/data/index.json, no data/index.json.
        # Olvidar esta copia es el error clásico de este pipeline.
        run: cp data/index.json app/src/data/index.json

      - name: Download images for any new cards
        # Sin esto un set nuevo entra en el catálogo pero se ve con el hueco del
        # CDN, y sobre todo NO SE PUEDE ESCANEAR: build_hashes necesita el
        # fichero local. Salta las que ya existen, así que en una semana normal
        # (sin set nuevo) no descarga nada y termina en segundos.
        run: python scripts/build_card_database.py --images-only

      - name: Hash the new images
        # Incremental: reutiliza los ~4600 hashes ya calculados y sólo procesa
        # los que faltan. Un set nuevo son ~120 imágenes, no el catálogo entero.
        run: python scripts/build_card_database.py --hashes-only --only-missing

      - name: Verify the catalog did not shrink or empty out
        # La automatización sólo sirve si se niega a publicar basura. Un cambio
        # de maquetación en origen NO se manifiesta como una excepción: se
        # manifiesta como cartas que desaparecen o campos que se vacían, y sin
        # esta comprobación acabaría en un PR de aspecto normal.
        run: |
          python - <<'PY'
          import json, pathlib, subprocess, sys

          new = json.loads(pathlib.Path('data/index.json').read_text(encoding='utf-8'))
          old_raw = subprocess.run(
              ['git', 'show', 'HEAD:data/index.json'],
              capture_output=True, text=True, encoding='utf-8',
          ).stdout
          if not old_raw:
              print('No hay índice previo con el que comparar — se acepta.')
              sys.exit(0)
          old = json.loads(old_raw)

          old_cards, new_cards = old.get('cards', {}), new.get('cards', {})
          print(f'{len(old_cards)} cartas antes, {len(new_cards)} después')

          # 1. El catálogo de un TCG no encoge. Si encoge, el scrape falló.
          missing = set(old_cards) - set(new_cards)
          if missing:
              print(f'FALLO: {len(missing)} cartas han desaparecido, p.ej. {sorted(missing)[:5]}')
              sys.exit(1)

          # 2. Los campos que la app da por hechos no pueden quedarse vacíos.
          for code, card in new_cards.items():
              if not card.get('name') or not card.get('variants'):
                  print(f'FALLO: {code} llega sin nombre o sin variantes')
                  sys.exit(1)

          # 3. Un set nuevo sin fecha no es un error, pero conviene saberlo.
          undated = [c for c, m in (new.get('set_meta') or {}).items()
                     if not m.get('release_date')]
          if undated:
              print(f'Aviso: {len(undated)} sets sin fecha de lanzamiento en el índice '
                    f'(usarán el mapa manual de setMeta.ts si lo tienen)')
          print('Catálogo verificado.')
          PY

      - name: Report what changed
        # Resumen legible en la pestaña Actions: si nadie mira el PR, esto es lo
        # que queda como rastro de qué hizo la ejecución.
        run: |
          {
            echo '### Refresco de catálogo'
            echo ''
            echo '| Fichero | Estado |'
            echo '|---|---|'
            for f in data/index.json data/meta.json data/hashes.json; do
              if git diff --quiet -- "$f"; then st='sin cambios'; else st='**modificado**'; fi
              echo "| \`$f\` | $st |"
            done
            new_imgs=$(git status --porcelain images | grep -c '^??' || true)
            echo "| imágenes nuevas | $new_imgs |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open PR if the catalog moved
        uses: peter-evans/create-pull-request@v6
        with:
          branch: data/catalog-refresh
          commit-message: 'chore(data): refresh card catalog'
          title: 'chore(data): refresh card catalog'
          body: |
            Refresco automático de `data/index.json` desde el sitio oficial.

            Revisa el diff antes de mergear: un cambio de maquetación en origen
            se manifiesta como cartas que desaparecen o campos que se vacían,
            no como un fallo del script.
          # meta.json NO es opcional aquí. El cliente (lib/remoteIndex.ts) pide
          # primero data/meta.json y compara su `version` con la que ya tiene;
          # sólo si ha subido descarga index.json. Si el PR trae el índice nuevo
          # pero deja el meta viejo, el CDN sirve cartas nuevas que la app no
          # llegará a pedir nunca — y sin ningún error por ningún lado.
          add-paths: |
            data/index.json
            data/meta.json
            data/hashes.json
            app/src/data/index.json
            app/src/data/meta.json
            app/src/data/hashes.json
            images

  prices:
    name: Prices (Cardmarket)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'schedule' || inputs.prices }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: |
          pip install requests cloudscraper beautifulsoup4 playwright
          playwright install --with-deps chromium

      - name: Scrape Cardmarket product URLs (best effort)
        # Cardmarket bloquea a Cloudflare casi siempre a un runner de CI —
        # por eso este paso es continue-on-error y solo aporta product_url
        # (el link "Ver en Cardmarket" de la app) cuando cuela. Los precios
        # de verdad NO dependen de este paso, ver el siguiente.
        continue-on-error: true
        run: python scripts/build_prices.py --browser --all

      - name: Fetch Cardmarket prices (bulk feed, no Cloudflare)
        # Cardmarket publica a diario un catálogo + guía de precios por juego
        # en un bucket S3 público, sin Cloudflare delante (a diferencia del
        # sitio). Ver scripts/build_prices_bulk.py para el porqué y la
        # heurística de emparejamiento código+variante. Este paso SÍ debe
        # funcionar siempre — si falla, es una señal real (el feed cambió de
        # sitio o de formato), no ruido de bot-detection.
        run: python scripts/build_prices_bulk.py

      - name: Verify the scrape produced something usable
        id: verify
        run: |
          python - <<'PY'
          import json, pathlib, sys
          p = pathlib.Path('data/prices.json')
          if not p.exists():
              print('prices.json no existe'); sys.exit(1)
          entries = json.loads(p.read_text(encoding='utf-8')).get('prices', {})
          priced = [e for e in entries.values() if e.get('low') or e.get('trend')]
          print(f'{len(entries)} entradas, {len(priced)} con precio')
          # Umbral defensivo: el feed bulk cubre de forma fiable el print base
          # (Normal+Parallel) de la inmensa mayoría de códigos — sobre 3300 en
          # la primera prueba manual. Si cae muy por debajo, algo se rompió.
          if len(priced) < 2000:
              print('Muy pocas entradas con precio — se descarta el resultado'); sys.exit(1)
          PY

      - name: Commit and push prices if they moved
        # Directo a `main`, sin PR — ver el comentario de cabecera. `git diff
        # --quiet` decide si hay algo que commitear; sin cambios (mismo precio
        # que ayer) no se crea un commit vacío.
        if: steps.verify.outcome == 'success'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/prices.json app/src/data/prices.json
          if git diff --cached --quiet; then
            echo "Sin cambios en los precios."
          else
            git commit -m 'chore(data): refresh Cardmarket prices'
            git push
          fi
